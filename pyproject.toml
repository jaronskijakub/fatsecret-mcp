[project]
name = "fatsecret-mcp"
version = "0.2.0"
description = "Unofficial, self-hosted MCP server for logging food to a FatSecret diary through Claude or ChatGPT."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Jaroński" }]
keywords = ["mcp", "fatsecret", "claude", "chatgpt", "food diary", "calorie counter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.13,<3",
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "starlette>=0.48,<2",
    "tzdata>=2026.1",
    "uvicorn>=0.31.1,<1",
]

[project.scripts]
fatsecret-mcp = "fatsecret_mcp.cli.main:main"

[project.urls]
Repository = "https://github.com/jaronskijakub/fatsecret-mcp"
Documentation = "https://github.com/jaronskijakub/fatsecret-mcp/tree/main/docs"
Changelog = "https://github.com/jaronskijakub/fatsecret-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/jaronskijakub/fatsecret-mcp/issues"

[build-system]
requires = ["uv_build>=0.10.12,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
